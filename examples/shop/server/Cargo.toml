[package]
name = "shop_server"
version = "0.0.0"
edition = "2021"
publish = false

# Its own workspace: a build is either the server's side (postgres) or a
# replica's (sqlite), never both.
[workspace]

[dependencies]
magic_sync = { path = "../../../magic_sync", features = ["postgres"] }
shop_rows = { path = "../rows", features = ["server"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v7"] }
