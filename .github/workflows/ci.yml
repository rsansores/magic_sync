name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # A build is one side: each is linted on its own.
      - run: cargo clippy --locked -p magic_sync --features postgres --all-targets -- -D warnings
      - run: cargo clippy --locked -p magic_sync -p magic_sync_derive --features sqlite --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps -p magic_sync --features postgres
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --locked --no-deps -p magic_sync --features sqlite
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Each test creates a database of its own from this one.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p magic_sync --features postgres
      - run: cargo test --locked -p magic_sync --features sqlite

  # What a host can name, on each side, is what magic_sync/public-api/ lists:
  # a change to it is made there too, on purpose, and reviewed as one. The
  # listing is read off rustdoc's JSON, so the nightly is pinned.
  public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-10
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api@0.52.0
      - uses: Swatinem/rust-cache@v2
      - run: |
          for side in postgres sqlite; do
            cargo +nightly-2026-10-10 public-api -p magic_sync --features "$side" -s > "$RUNNER_TEMP/$side.txt"
            diff -u "magic_sync/public-api/$side.txt" "$RUNNER_TEMP/$side.txt"
          done

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p magic_sync --features postgres
      - run: cargo check --locked -p magic_sync --features sqlite

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/shop/server
            examples/shop/register
      # The head office's page: a Vue app over the dashboard, built from source.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: dashboard/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts && pnpm build
        working-directory: dashboard
      - run: pnpm install --frozen-lockfile --ignore-scripts && pnpm build
        working-directory: examples/shop/web
      - run: cargo build --locked --manifest-path examples/shop/server/Cargo.toml
      - run: cargo build --locked --manifest-path examples/shop/register/Cargo.toml

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      # The pnpm version comes from package.json's `packageManager`.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: dashboard/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
      - run: pnpm lint
      # Checks the engine's answers in src/core/contract/fixtures/ against the
      # types generated from the engine's own, both of which the engine's
      # tests keep equal to what it serializes.
      - run: pnpm type-check
      - run: pnpm knip
      - run: pnpm test
      # Builds, then lints the packed tarball as npm and TypeScript read it.
      - run: pnpm check:pack

  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: mdbook build book
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: book/book

  # The book on GitHub Pages: Settings → Pages → Source: GitHub Actions.
  pages:
    needs: book
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
