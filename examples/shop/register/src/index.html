<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Register</title>
<style>
  :root { --ink: #1d2433; --muted: #6b7385; --line: #e3e6ee; --accent: #3b5bdb; --ok: #2f9e44; --off: #c92a2a; }
  body { font: 14px/1.4 system-ui, sans-serif; color: var(--ink); margin: 0; padding: 12px; background: white; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  button { font: inherit; padding: 5px 10px; border: 0; border-radius: 6px; background: var(--accent); color: white; cursor: pointer; }
  button.plug { background: var(--ink); }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .note { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .footer { display: flex; gap: 6px; align-items: center; margin-top: 10px; font-size: 13px; }
  .footer input { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; width: 150px; }
</style>
</head>
<body>
<div class="top">
  <strong><span class="dot" id="dot"></span><span id="name"></span></strong>
  <button class="plug" id="plug"></button>
</div>
<ul id="products"></ul>
<p class="note" id="note"></p>
<form class="footer" id="footer-form">
  <label>Footer <input id="footer" maxlength="80"></label>
  <button>Change here</button>
  <button type="button" class="plug" id="printer"></button>
</form>
<script>
const money = c => (c / 100).toFixed(2);
async function sell(id) {
  await fetch('/api/sell', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ product_id: id }) });
  refresh();
}
async function plug() { await fetch('/api/plug', { method: 'POST' }); refresh(); }
async function printer() { await fetch('/api/printer', { method: 'POST' }); refresh(); }
async function changeFooter(event) {
  event.preventDefault();
  const text = document.getElementById('footer').value;
  await fetch('/api/footer', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }) });
  document.getElementById('footer').blur();
  refresh();
}
function item(className, text) {
  const li = document.createElement('li');
  li.className = className;
  li.textContent = text;
  return li;
}
function product(p) {
  const li = item('', '');
  const label = document.createElement('span');
  label.textContent = `${p.name} · ${money(p.price_cents)}`;
  const button = document.createElement('button');
  button.textContent = 'Sell';
  button.addEventListener('click', () => sell(p.id));
  li.append(label, button);
  return li;
}
async function refresh() {
  const s = await (await fetch('/api/state')).json();
  document.getElementById('name').textContent = s.name;
  document.getElementById('dot').style.background = s.online ? 'var(--ok)' : 'var(--off)';
  document.getElementById('plug').textContent = s.online ? 'Unplug' : 'Plug in';
  document.getElementById('printer').textContent = s.printer ? 'Printer off' : 'Printer on';
  const footer = document.getElementById('footer');
  // Left alone while it is being edited.
  if (document.activeElement !== footer) footer.value = s.footer;
  // Built as elements, never as HTML: a product's name is the head office's
  // text, and stays text.
  document.getElementById('products').replaceChildren(...(s.products.length
    ? s.products.map(product)
    : [item('note', 'Holds no product yet.')]));
  const waiting = s.unsent + s.unfiled;
  document.getElementById('note').textContent = `${s.sold} sold` +
    (waiting ? ` · ${waiting} receipt${waiting > 1 ? 's' : ''} not at the head office yet` : ' · all at the head office');
}
document.getElementById('plug').addEventListener('click', plug);
document.getElementById('printer').addEventListener('click', printer);
document.getElementById('footer-form').addEventListener('submit', changeFooter);
refresh(); setInterval(refresh, 700);
</script>
</body>
</html>
