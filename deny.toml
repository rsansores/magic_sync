# What `cargo deny check` holds the engine's dependencies to, on both sides
# (it reads the graph with every feature on: no build, so the two sides do
# not meet).

[graph]
all-features = true

[advisories]
# A vulnerability or an unmaintained crate fails; a yanked version too.
yanked = "deny"

[licenses]
# What a crate licensed MIT OR Apache-2.0 may depend on.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The path dependency on the derive carries a version too.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
