[package]
name = "shop_register"
version = "0.0.0"
edition = "2021"
publish = false

# Its own workspace: a build is either the server's side (postgres) or a
# replica's (sqlite), never both.
[workspace]

[dependencies]
magic_sync = { path = "../../../magic_sync", features = ["sqlite"] }
shop_rows = { path = "../rows", features = ["register"] }
axum = "0.8"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v7"] }
