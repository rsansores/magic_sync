name: Advisories

# A new advisory is published against a crate a lockfile already holds, on a
# day nothing was pushed: CI's `dependencies` job only looks when someone
# pushes. This looks every day, at the same lockfiles.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - Cargo.toml
          - examples/shop/server/Cargo.toml
          - examples/shop/register/Cargo.toml
          - book/snippets/Cargo.toml
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: ${{ matrix.manifest }}
          command: check advisories
          arguments: --locked
