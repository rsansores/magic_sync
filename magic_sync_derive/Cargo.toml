[package]
name = "magic_sync_derive"
description = "#[derive(Row)] for magic_sync: one struct is one table, and says how it travels"
keywords = ["sync", "replication", "derive"]
categories = ["database", "development-tools::procedural-macro-helpers"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
homepage = "https://rsansores.github.io/magic_sync/"
documentation = "https://docs.rs/magic_sync"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }
