[package]
name = "shop_rows"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
magic_sync = { path = "../../../magic_sync" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "uuid", "chrono"] }
uuid = { version = "1", features = ["serde", "v7"] }

[features]
server = ["magic_sync/postgres"]
register = ["magic_sync/sqlite"]
